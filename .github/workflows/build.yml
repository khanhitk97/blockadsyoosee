name: Build iOS AdBlock Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Compile Dylib with Clang
        run: |
          mkdir -p output
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Biên dịch nhắm target arm64 cho iOS 14.0 trở lên
          clang -target arm64-apple-ios14.0 \
            -isysroot "$SDK_PATH" \
            -shared \
            -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework WebKit \
            -O2 \
            -o output/libAdBlock.dylib \
            src/hook.m

      - name: Ad-Hoc Sign Binary
        run: |
          # Ký mã ad-hoc để tương thích tốt với TrollStore / AltStore / Sideloadly
          codesign -f -s - output/libAdBlock.dylib
          otool -L output/libAdBlock.dylib

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libAdBlock-iOS
          path: output/libAdBlock.dylib
